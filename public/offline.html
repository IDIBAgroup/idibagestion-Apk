<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#081c2d">
    <title>Hors ligne — IDIBAGES</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #081c2d; color: #f5f7f8; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 28rem); padding: 32px; border: 1px solid #ffffff24; border-radius: 8px; background: #102b3c; text-align: center; }
      .mark { display: grid; width: 56px; height: 56px; margin: 0 auto 20px; place-items: center; border-radius: 16px; background: #1fb472; color: #081c2d; font-weight: 800; }
      h1 { margin: 0 0 12px; font-size: 1.5rem; }
      p { margin: 0 0 24px; color: #c8d5dc; }
      button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 4px; background: #1fb472; color: #081c2d; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body><main><div class="mark" aria-hidden="true">ID</div><h1>Connexion indisponible</h1><p>IDIBAGES a besoin d’une connexion pour charger vos données et confirmer vos opérations. Rétablissez le réseau puis réessayez.</p><button onclick="location.reload()">Réessayer</button></main></body>
</html>
